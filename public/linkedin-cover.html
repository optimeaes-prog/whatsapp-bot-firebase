<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proplead — LinkedIn Cover</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 4200px;
    height: 700px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .cover {
    width: 4200px;
    height: 700px;
    position: relative;
    background: #FFB03F;
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Subtle warm highlight top-right */
  .glow {
    position: absolute;
    width: 2000px;
    height: 1200px;
    background: radial-gradient(ellipse, rgba(255,255,255,0.15) 0%, transparent 60%);
    right: -200px;
    top: -400px;
    pointer-events: none;
  }

  /* Bottom-left safe zone for LinkedIn logo — content avoids this */
  /* LinkedIn logo ~400x400px at this canvas size, bottom-left corner */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-left: 1440px;
    padding-top: 110px;
    padding-bottom: 110px;
    padding-right: 400px;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 54px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(64, 46, 50, 0.60);
  }

  .headline {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 120px;
    font-weight: 800;
    line-height: 1.08;
    color: #402e32;
    letter-spacing: -0.03em;
  }

  .headline .white {
    color: #fff;
  }

  .sub {
    font-family: 'Inter', sans-serif;
    font-size: 48px;
    font-weight: 500;
    color: rgba(64, 46, 50, 0.55);
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="glow"></div>
  <div class="content">
    <div class="eyebrow">CRM con IA · España</div>
    <div class="headline">
      Cierra más ventas.<br>
      <span class="white">Cualifica leads</span> en WhatsApp con IA.
    </div>
    <div class="sub">Respuesta automática 24/7 · Idealista · Fotocasa · Pisos.com</div>
  </div>
</div>
</body>
</html>
